name: Deploy

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions: { contents: read }

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      STORY_DATA: src/data/blue-archive-story-order.jsonc
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x, cache: true }
      # Data is crawled by scripts/publish-data.ts on a maintainer machine because
      # namu.wiki answers GitHub-hosted runners with a Cloudflare challenge.
      - name: Use the newer of the latest data release and the committed file
        run: |
          tag=$(gh release list --json tagName --jq '[.[].tagName | select(startswith("data-"))] | sort | last // empty')
          [ -n "$tag" ] && gh release download "$tag" --pattern '*.jsonc' --dir .cache/story-data
          deno eval '
            import { parse } from "@std/jsonc"
            const [tracked, cached] = Deno.args
            const generatedAt = async (path) =>
              (parse(await Deno.readTextFile(path).catch(() => "{}"))).generatedAt ?? ""
            if (await generatedAt(cached) > await generatedAt(tracked)) await Deno.copyFile(cached, tracked)
            console.log(`Using story data from ${await generatedAt(tracked)}`)
          ' "$STORY_DATA" .cache/story-data/blue-archive-story-order.jsonc
      - run: deno test -A
      - run: deno task build
      # wrangler-action installs wrangler with npm, which fails on the node_modules Deno creates.
      - run: deno run -A npm:wrangler@4.105.0 pages deploy dist --project-name=sefirot --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
